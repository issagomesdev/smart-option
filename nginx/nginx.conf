# Reverse proxy de produção para o Smart Option Backend.
# Antes de subir: troque "example.com" pelo domínio real (ocorre 2x abaixo)
# e rode o passo de emissão de certificado descrito em docs/deploy.md.

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  log_format main '$remote_addr - $http_x_request_id [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log main;

  # Limite de taxa na borda, antes mesmo de chegar ao rate limit da aplicação
  # (Fase 1) — segunda camada, não substitui a da aplicação.
  limit_req_zone $binary_remote_addr zone=smart_option_edge:10m rate=20r/s;

  upstream smart_option_app {
    server app:3000;
    keepalive 32;
  }

  # HTTP: responde o desafio ACME do certbot e redireciona todo o resto para HTTPS.
  server {
    listen 80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req zone=smart_option_edge burst=40 nodelay;

    location / {
      proxy_pass http://smart_option_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
    }
  }
}
