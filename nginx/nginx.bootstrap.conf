# Config temporária usada só no primeiro boot, antes de existir certificado
# TLS — serve a aplicação em HTTP puro e responde ao desafio ACME do
# certbot. Depois de emitir o certificado (docs/deploy.md), troque o volume
# do Nginx para nginx.conf (com HTTPS) e não use mais este arquivo.

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;

  upstream smart_option_app {
    server app:3000;
  }

  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://smart_option_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
