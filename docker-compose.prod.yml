name: smart-option

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - smart_option_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - smart_option_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # NÃO usar `env_file: .env`: o Compose interpola `${...}`/engole "$" solto
    # também dentro de arquivos carregados por `env_file` — uma
    # ASAAS_API_KEY de verdade (formato `$aact_...`) vira string vazia
    # silenciosamente (bug real encontrado na Fase 11, verificado com
    # `docker compose config`). Em vez disso, o `.env` é montado como arquivo
    # e lido pelo `dotenv` da própria aplicação, sem passar pelo interpolador
    # do Compose.
    environment:
      # Force NODE_ENV=production neste compose independentemente do que
      # estiver em ".env" — um ".env" copiado de um ambiente de
      # desenvolvimento não deve conseguir religar o transport "pino-pretty"
      # (devDependency, removido da imagem "runtime" por `npm prune --omit=dev`)
      # nem desativar outros comportamentos condicionados a `isProduction`.
      NODE_ENV: production
      # Fixo para casar com o upstream "app:3000" hard-coded no Caddyfile —
      # nunca deixar um APP_PORT herdado de um ".env" de outro ambiente
      # (ex.: dev local usando 3001 para não colidir com outro serviço)
      # quebrar o proxy silenciosamente.
      APP_PORT: 3000
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379
    # Publicada SEMPRE em 127.0.0.1, nunca em 0.0.0.0. O Docker escreve as próprias regras de
    # iptables e passa por cima do UFW: um mapeamento "3008:3000" deixaria a API acessível em
    # http://IP-DA-VPS:3008 — sem TLS e contornando o proxy — com o `ufw status` continuando a
    # mostrar a porta como bloqueada.
    #
    # Só é necessária quando um proxy do host (Nginx/Traefik já existente na VPS) faz o
    # roteamento, cenário em que o serviço "caddy" abaixo não sobe. Com o Caddy deste compose,
    # ela é inofensiva: o tráfego entra pela rede interna, não por aqui.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # Container efêmero para aplicar migrations/seed contra o banco de produção.
  # Não sobe com `docker compose up` (fora do profile default) — rodar sob
  # demanda: `docker compose -f docker-compose.prod.yml --profile tools run --rm migrate`.
  migrate:
    build:
      context: .
      target: builder
    # Mesmo motivo do serviço "app" acima — sem `env_file`, `.env` montado.
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.env:/app/.env:ro
    command: ["npm", "run", "db:migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - tools

  # Reverse proxy + TLS. Substitui Nginx + Certbot: o próprio Caddy emite e
  # renova o certificado Let's Encrypt sozinho (desafio HTTP-01 na porta 80,
  # via o mesmo processo, sem container/cron separado) — não há passo de
  # "config HTTP temporária" nem edição deste arquivo no primeiro deploy.
  # DOMAIN/ACME_EMAIL vêm do ".env" (mesmo mecanismo de interpolação
  # `${...}` já usado acima para DB_PASSWORD/DB_DATABASE/DB_USER).
  #
  # Opcional, atrás do profile "caddy": numa VPS que já hospeda outros projetos, 80/443
  # normalmente pertencem a um proxy do host (Nginx, Traefik) e subir este serviço junto falharia
  # ao fazer bind. Sem o profile, o compose sobe só app/mysql/redis e o proxy existente encaminha
  # para `127.0.0.1:${APP_HOST_PORT}` — nesse caso DOMAIN/ACME_EMAIL não são usadas, porque quem
  # emite o certificado é o proxy de fora.
  #
  #   VPS dedicada:  docker compose -f docker-compose.prod.yml --profile caddy up -d
  #   proxy do host: docker compose -f docker-compose.prod.yml up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados + estado da conta ACME — precisa ser um volume nomeado
      # persistente: perdê-lo faz o Caddy reemitir o certificado no próximo
      # boot, e o Let's Encrypt tem limite de emissões por domínio/semana.
      - smart_option_caddy_data:/data
      - smart_option_caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  smart_option_mysql_data:
  smart_option_redis_data:
  smart_option_caddy_data:
  smart_option_caddy_config:
